name: DownwriteMobile
options:
  bundleIdPrefix: com.charliewilco
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  DownwriteMobile:
    type: application
    platform: iOS
    sources:
      - DownwriteMobile/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charliewilco.downwrite.mobile
        INFOPLIST_FILE: DownwriteMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DownwriteMobile/Info.plist
      properties:
        CFBundleDisplayName: Downwrite
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  DownwriteMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DownwriteMobile/Tests
    dependencies:
      - target: DownwriteMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charliewilco.downwrite.mobile.tests
schemes:
  DownwriteMobile:
    build:
      targets:
        DownwriteMobile: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DownwriteMobileTests
    archive:
      config: Release
