version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automerge"

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
