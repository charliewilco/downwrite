name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - working-directory: worker
        run: npm ci

      - working-directory: worker
        run: npm run format:check

      - working-directory: worker
        run: npm run validate

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - working-directory: cli
        run: cargo fmt --check

      - working-directory: cli
        run: cargo test --locked

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - working-directory: worker
        run: npm ci

      - name: Verify generated iOS client is current
        working-directory: worker
        run: npm run generate:ios-client

      - name: Check generated client diff
        run: git diff --exit-code -- iOS/OpenAPI/openapi.json iOS/DownwriteAPI/Sources/DownwriteAPI

      - name: Test iOS app
        run: xcodebuild test -project iOS/Downwrite/Downwrite.xcodeproj -scheme Downwrite -destination 'platform=iOS Simulator,name=iPhone 17' -configuration Debug -only-testing:DownwriteTests
