name: Go CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./cmd/downwrite

  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: downwrite
          POSTGRES_USER: downwrite
          POSTGRES_PASSWORD: downwrite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U downwrite -d downwrite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DOWNWRITE_TEST_DATABASE_URL: postgresql://downwrite:downwrite@localhost:5432/downwrite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres store test
        run: go test ./internal/app -run TestPostgresStoreDocumentWorkflow -count=1
