{{define "share.html"}}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{.Title}}</title>
		<link rel="stylesheet" href="/static/app.css?v=canvas13">
		<script src="https://unpkg.com/htmx.org@2.0.4"></script>
		<script type="module" src="/static/app.js?v=canvas13"></script>
	</head>
	<body>
<main class="shared-shell app-shell">
	<header class="topbar shell-header">
		<div class="topbar-copy">
			<p class="eyebrow">Shared document</p>
			<h1>{{.Document.Title}}</h1>
			<p class="subdued">Version {{.Version.VersionNumber}}</p>
		</div>
	</header>
	<article class="reader-page shared-reader">
		<div class="reader-panel">{{safeHTML .Version.ContentHTML}}</div>
	</article>
	{{if .Annotations}}
	<section class="shared-annotations">
		<h2>Annotations</h2>
		{{template "annotations_partial" .}}
	</section>
	{{end}}
</main>
	</body>
</html>
{{end}}
