{{define "share.html"}}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{.Title}}</title>
		<link rel="stylesheet" href="/static/app.css">
		<script src="https://unpkg.com/htmx.org@2.0.4"></script>
		<script defer src="/static/app.js"></script>
	</head>
	<body>
<main class="app-shell narrow">
	<header class="topbar">
		<div>
			<p class="eyebrow">Shared version</p>
			<h1>{{.Document.Title}}</h1>
			<p class="muted">Version {{.Version.VersionNumber}}</p>
		</div>
	</header>
	<article class="panel reader-panel">
		<div class="reader-html">{{safeHTML .Version.ContentHTML}}</div>
	</article>
	{{if .Annotations}}
	<section class="panel">
		<h2>Annotations</h2>
		{{template "annotations_partial" .}}
	</section>
	{{end}}
</main>
	</body>
</html>
{{end}}
