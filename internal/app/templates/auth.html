{{define "auth.html"}}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{.Title}}</title>
		<link rel="stylesheet" href="/static/app.css?v=canvas13">
		<script src="https://unpkg.com/htmx.org@2.0.4"></script>
		<script type="module" src="/static/app.js?v=canvas13"></script>
	</head>
	<body>
<main class="auth-shell">
	<form class="panel auth-panel form-stack" method="post" action="{{.Action}}">
		<p class="eyebrow">{{if eq .Mode "signup"}}Create account{{else}}Welcome back{{end}}</p>
		<h1>{{.Title}}</h1>
		{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
		{{if eq .Mode "signup"}}
			<label>Name <input type="text" name="name" required></label>
		{{end}}
		<label>Email <input type="email" name="email" required></label>
		<label>Password <input type="password" name="password" required></label>
		<button class="button" type="submit">{{.Title}}</button>
		<p class="muted">
			{{if eq .Mode "signup"}}
				Already have an account? <a href="/login">Login</a>
			{{else}}
				Need an account? <a href="/signup">Create one</a>
			{{end}}
		</p>
	</form>
</main>
	</body>
</html>
{{end}}
