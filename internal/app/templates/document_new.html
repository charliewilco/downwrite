{{define "document_new.html"}}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{.Title}}</title>
		<link rel="stylesheet" href="/static/app.css">
		<script src="https://unpkg.com/htmx.org@2.0.4"></script>
		<script defer src="/static/app.js"></script>
	</head>
	<body>
<main class="app-shell narrow">
	<header class="topbar shell-header">
		<div class="topbar-copy">
			<p class="eyebrow">New document</p>
			<h1>Create a versioned markdown document</h1>
			<p class="subdued">Keep composition lightweight. The value here is in the archive, the versions, and the discussion around the text.</p>
		</div>
		<nav class="topnav">
			<a href="/app">Back to library</a>
		</nav>
	</header>

	<form class="panel form-sheet form-stack" method="post" action="/app/documents">
		<label>Title <input type="text" name="title" required></label>
		<label>Markdown <textarea name="content" rows="22" required></textarea></label>
		<button class="button" type="submit">Create document</button>
	</form>
</main>
	</body>
</html>
{{end}}
