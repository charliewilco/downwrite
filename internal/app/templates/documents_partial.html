{{define "documents_partial"}}
<ul class="document-list">
	{{range .Stacks}}
		<li class="document-row">
			<dw-document-card
				href="/app/stacks/{{.ID}}"
				title="{{.Name}}"
				version="{{.DocumentCount}} doc{{if ne .DocumentCount 1}}s{{end}}"
				excerpt="{{.LatestDocumentTitle}} · {{.Excerpt}}"
				color="{{.Color}}"
				typeface="{{.Theme}}"></dw-document-card>
		</li>
	{{else}}
		<li class="empty-state">
			<strong>No stacks yet.</strong>
			<p class="subdued">Create a named stack from markdown or import a file.</p>
		</li>
	{{end}}
</ul>
{{end}}
