{{define "diff.html"}}
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>{{.Title}}</title>
		<link rel="stylesheet" href="/static/app.css">
		<script src="https://unpkg.com/htmx.org@2.0.4"></script>
		<script defer src="/static/app.js"></script>
	</head>
	<body>
<main class="app-shell narrow">
	<header class="topbar shell-header">
		<div class="topbar-copy">
			<p class="eyebrow">Diff</p>
			<h1>{{.Document.Title}}</h1>
			<p class="subdued">Version {{.FromVersion.VersionNumber}} to {{.ToVersion.VersionNumber}}</p>
		</div>
		<nav class="topnav">
			<a href="/app/documents/{{.Document.ID}}?version={{.ToVersion.ID}}">Back to document</a>
		</nav>
	</header>

	<section class="diff-panel">
		{{range .Diffs}}
			{{if eq .Type 1}}
				<ins>{{.Text}}</ins>
			{{else if eq .Type -1}}
				<del>{{.Text}}</del>
			{{else}}
				<pre>{{.Text}}</pre>
			{{end}}
		{{end}}
	</section>
</main>
	</body>
</html>
{{end}}
